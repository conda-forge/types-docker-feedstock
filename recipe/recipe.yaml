schema_version: 1

context:
  name: types-docker
  version: "7.2.0.20261122"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/e5/4c/b192c2d36ff0d6436f6e81b73d486d7829c7e521492746358fdee2ac9b44/types_docker-${{ version }}.tar.gz
  sha256: 69a7f1910c3cffb4ddf7fb3165bad6141058b03ec2679c73b56cd961e7772db7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=82.0.1
    - pip
  run:
    - python >=${{ python_min }}
    - requests >=2.34.0
    - types-paramiko
    - urllib3 >=2

tests:
  - python:
      imports:  # dummy import to get pip_check running
        - os
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - package_contents:
      site_packages:
        - docker-stubs/__init__.pyi

about:
  summary: Typing stubs for docker
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/python/typeshed/tree/main/stubs/docker

extra:
  recipe-maintainers:
    - StevenSchaererQC
